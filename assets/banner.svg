<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="jobfeed: fresh SDE-1 and Frontend jobs in India, every morning, in one Excel file">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111c3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#34d399"/>
      <animate attributeName="x1" values="0;-1;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace; }
      .card { animation: rise 9s ease-in-out infinite; opacity: 0; }
      .c2 { animation-delay: 3s; } .c3 { animation-delay: 6s; }
      @keyframes rise {
        0% { opacity: 0; transform: translateY(40px); }
        8%, 30% { opacity: 1; transform: translateY(0); }
        38%, 100% { opacity: 0; transform: translateY(-40px); }
      }
      .pill { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="930" cy="160" r="260" fill="url(#glow)">
      <animate attributeName="r" values="240;290;240" dur="7s" repeatCount="indefinite"/>
    </circle>
    <!-- scanning line -->
    <rect x="0" y="0" width="1200" height="2" fill="url(#accent)" opacity="0.6">
      <animate attributeName="y" values="0;318;0" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- left: title -->
    <text x="64" y="128" font-size="76" font-weight="800" fill="url(#accent)" letter-spacing="-2">jobfeed</text>
    <text x="68" y="172" font-size="24" fill="#cbd5e1">Fresh SDE-1 &amp; Frontend jobs in India,</text>
    <text x="68" y="204" font-size="24" fill="#cbd5e1">every morning, in one Excel file.</text>

    <!-- terminal prompt with typing effect -->
    <g transform="translate(68 236)">
      <rect width="250" height="40" rx="10" fill="#0f172a" stroke="#334155"/>
      <text x="16" y="26" font-size="16" fill="#34d399" class="mono">$</text>
      <clipPath id="typed"><rect x="34" y="0" width="0" height="40">
        <animate attributeName="width" values="0;180;180" keyTimes="0;0.6;1" dur="4s" repeatCount="indefinite"/>
      </rect></clipPath>
      <text x="34" y="26" font-size="16" fill="#e2e8f0" class="mono" clip-path="url(#typed)">python jobfeed.py</text>
      <rect x="36" y="12" width="9" height="18" fill="#e2e8f0" class="cursor">
        <animate attributeName="x" values="36;216;216" keyTimes="0;0.6;1" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- right: job cards cycling -->
    <g transform="translate(700 70)">
      <g class="card c1">
        <rect width="420" height="96" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.6"/>
        <text x="22" y="38" font-size="20" font-weight="700" fill="#f1f5f9">Software Engineer I</text>
        <text x="22" y="68" font-size="16" fill="#94a3b8">Bengaluru · posted 2 days ago</text>
        <rect x="322" y="54" width="78" height="28" rx="14" fill="#38bdf8"/>
        <text x="361" y="73" font-size="14" font-weight="700" fill="#0b1020" text-anchor="middle">Apply</text>
      </g>
      <g class="card c2">
        <rect width="420" height="96" rx="14" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.6"/>
        <text x="22" y="38" font-size="20" font-weight="700" fill="#f1f5f9">Frontend Developer</text>
        <text x="22" y="68" font-size="16" fill="#94a3b8">Hyderabad · posted today</text>
        <rect x="322" y="54" width="78" height="28" rx="14" fill="#818cf8"/>
        <text x="361" y="73" font-size="14" font-weight="700" fill="#0b1020" text-anchor="middle">Apply</text>
      </g>
      <g class="card c3">
        <rect width="420" height="96" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity="0.6"/>
        <text x="22" y="38" font-size="20" font-weight="700" fill="#f1f5f9">SDE-1, Web Platform</text>
        <text x="22" y="68" font-size="16" fill="#94a3b8">Pune · posted 5 days ago</text>
        <rect x="322" y="54" width="78" height="28" rx="14" fill="#34d399"/>
        <text x="361" y="73" font-size="14" font-weight="700" fill="#0b1020" text-anchor="middle">Apply</text>
      </g>
    </g>

    <!-- city pills -->
    <g transform="translate(700 214)" font-size="13" fill="#e2e8f0">
      <g class="pill"><rect width="92" height="28" rx="14" fill="#1e293b"/><text x="46" y="19" text-anchor="middle">Bengaluru</text></g>
      <g class="pill" style="animation-delay:.5s"><rect x="102" width="92" height="28" rx="14" fill="#1e293b"/><text x="148" y="19" text-anchor="middle">Hyderabad</text></g>
      <g class="pill" style="animation-delay:1s"><rect x="204" width="62" height="28" rx="14" fill="#1e293b"/><text x="235" y="19" text-anchor="middle">Pune</text></g>
      <g class="pill" style="animation-delay:1.5s"><rect x="276" width="76" height="28" rx="14" fill="#1e293b"/><text x="314" y="19" text-anchor="middle">Mumbai</text></g>
      <g class="pill" style="animation-delay:2s"><rect x="362" width="58" height="28" rx="14" fill="#1e293b"/><text x="391" y="19" text-anchor="middle">NCR</text></g>
    </g>
    <text x="700" y="272" font-size="14" fill="#64748b">Greenhouse · Lever · Ashby  —  last 7 days only</text>
  </g>
</svg>
